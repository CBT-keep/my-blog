name: Build and publish blog

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: blog-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build static site
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.15.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package dist
        run: tar -czf blog-dist.tar.gz -C dist .

      - name: Publish latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view blog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit blog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --notes "Automated build from $GITHUB_SHA"
          else
            gh release create blog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest blog build" \
              --notes "Automated build from $GITHUB_SHA"
          fi
          gh release upload blog-latest blog-dist.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
